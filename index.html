<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>课程分类自动写入原型</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef0f3; color: #303133; }
    body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .workspace { display: flex; align-items: flex-start; justify-content: center; gap: 20px; padding: 20px; }
    .page-frame { width: min(960px, calc(100vw - 316px)); background: #fff; border: 1px solid #dcdfe6; }
    .page-frame img { display: block; width: 100%; height: auto; }
    .controls { position: sticky; top: 20px; width: 256px; background: #fff; border: 1px solid #dcdfe6; padding: 16px; }
    .controls h1 { margin: 0 0 14px; font-size: 16px; line-height: 24px; }
    .control-list { display: grid; gap: 10px; }
    button { width: 100%; height: 36px; border: 1px solid #dcdfe6; background: #fff; color: #606266; font: inherit; cursor: pointer; }
    button:hover { border-color: #409eff; color: #409eff; }
    button[aria-pressed="true"] { border-color: #409eff; background: #ecf5ff; color: #409eff; font-weight: 600; }
    .state { margin-top: 16px; padding-top: 14px; border-top: 1px solid #ebeef5; }
    .state-label { margin: 0 0 8px; color: #909399; font-size: 12px; }
    .state-title { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .state dl { display: grid; grid-template-columns: 72px 1fr; gap: 7px 8px; margin: 0; font-size: 12px; line-height: 18px; }
    .state dt { color: #909399; }
    .state dd { margin: 0; color: #606266; }
    @media (max-width: 900px) {
      .workspace { display: block; padding: 0 0 172px; }
      .page-frame { width: 100%; border: 0; }
      .controls { position: fixed; z-index: 10; right: 12px; bottom: 12px; top: auto; width: calc(100% - 24px); }
      .control-list { grid-template-columns: repeat(2, 1fr); }
      .state dl { grid-template-columns: 64px 1fr; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="page-frame" aria-label="课程编辑页面">
      <img id="screen" src="./pen-course-admin-assets/rBUs1.png?v=7" alt="课程编辑初始状态" />
    </section>
    <aside class="controls" aria-label="原型状态触发">
      <h1>状态触发</h1>
      <div class="control-list">
        <button type="button" data-state="initial" aria-pressed="true">初始状态</button>
        <button type="button" data-state="ai" aria-pressed="false">AI 已写入</button>
        <button type="button" data-state="fallback" aria-pressed="false">默认值已写入</button>
        <button type="button" data-state="manual" aria-pressed="false">人工修改</button>
      </div>
      <div class="state" aria-live="polite">
        <p class="state-label">当前状态</p>
        <p class="state-title" id="state-title">初始状态</p>
        <dl>
          <dt>难度</dt><dd id="difficulty">未选择</dd>
          <dt>课程大类</dt><dd id="category">未选择</dd>
          <dt>技术 Tag</dt><dd id="tags">未写入</dd>
        </dl>
      </div>
    </aside>
  </main>
  <script>
    const states = {
      initial: {
        image: "./pen-course-admin-assets/rBUs1.png?v=7",
        alt: "课程编辑初始状态",
        title: "初始状态",
        difficulty: "未选择",
        category: "未选择",
        tags: "未写入"
      },
      ai: {
        image: "./pen-course-admin-assets/JrDc9.png?v=7",
        alt: "AI 已写入状态",
        title: "AI 已写入",
        difficulty: "初级",
        category: "人工智能核心原理",
        tags: "已写入数据库"
      },
      fallback: {
        image: "./pen-course-admin-assets/lgSqg.png?v=7",
        alt: "默认值已写入状态",
        title: "默认值已写入",
        difficulty: "其他",
        category: "其他",
        tags: "空"
      },
      manual: {
        image: "./pen-course-admin-assets/UkFWP.png?v=7",
        alt: "人工修改状态",
        title: "人工修改",
        difficulty: "中级",
        category: "AI应用开发",
        tags: "保持当前数据库值"
      }
    };

    const screen = document.querySelector("#screen");
    const buttons = [...document.querySelectorAll("button[data-state]")];

    for (const button of buttons) {
      button.addEventListener("click", () => {
        const state = states[button.dataset.state];
        screen.src = state.image;
        screen.alt = state.alt;
        document.querySelector("#state-title").textContent = state.title;
        document.querySelector("#difficulty").textContent = state.difficulty;
        document.querySelector("#category").textContent = state.category;
        document.querySelector("#tags").textContent = state.tags;
        for (const item of buttons) item.setAttribute("aria-pressed", String(item === button));
      });
    }
  </script>
</body>
</html>
